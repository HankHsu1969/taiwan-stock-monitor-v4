<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>台股中線雷達 v4</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap');

:root{
  --ink:#0d0f14; --paper:#13161f; --card:#181c28; --rim:#252d45;
  --cyan:#00e5ff; --teal:#00b4d8; --violet:#9b5de5;
  --text:#dde4f0; --text2:#7a869e; --text3:#3d4a60;
  /* 台股：紅漲綠跌 */
  --up:#ff3b3b; --down:#00cc7a; --warn:#ffb700;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--ink);color:var(--text);font-family:'Noto Sans TC',sans-serif;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,229,255,.01) 3px,rgba(0,229,255,.01) 4px);pointer-events:none;z-index:9999}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 22px;background:var(--paper);border-bottom:1px solid var(--rim);position:sticky;top:0;z-index:100;gap:10px;flex-wrap:wrap}
.brand{font-family:'Orbitron',monospace;font-size:16px;font-weight:900;letter-spacing:3px;color:var(--cyan);text-shadow:0 0 16px rgba(0,229,255,.4)}
.brand-sub{font-size:9px;color:var(--text3);letter-spacing:2px;margin-top:1px}
.topbar-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.clock{font-family:'Share Tech Mono',monospace;font-size:13px;color:var(--cyan);background:rgba(0,229,255,.06);border:1px solid rgba(0,229,255,.2);padding:4px 10px;border-radius:4px;letter-spacing:2px}
.mst{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text2)}
.pdot{width:8px;height:8px;border-radius:50%;background:var(--down);box-shadow:0 0 0 0 rgba(0,204,122,.5);animation:ping 2s infinite}
.pdot.off{background:var(--text3);box-shadow:none;animation:none}
.pdot.spin{background:var(--warn);animation:ping .8s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(0,204,122,.5)}70%{box-shadow:0 0 0 8px rgba(0,204,122,0)}100%{box-shadow:0 0 0 0 rgba(0,204,122,0)}}
.tbtn{font-family:'Orbitron',monospace;font-size:9px;letter-spacing:1.5px;padding:6px 13px;border-radius:4px;cursor:pointer;transition:all .2s;white-space:nowrap}
.tbtn.cyan{border:1px solid var(--cyan);background:rgba(0,229,255,.05);color:var(--cyan)}
.tbtn.cyan:hover{background:rgba(0,229,255,.15)}
.tbtn.violet{border:1px solid var(--violet);background:rgba(155,93,229,.05);color:var(--violet)}
.tbtn.violet:hover{background:rgba(155,93,229,.15)}
.tbtn.warn{border:1px solid var(--warn);background:rgba(255,183,0,.05);color:var(--warn)}
.tbtn:disabled{opacity:.4;cursor:not-allowed}

.main{max-width:1520px;margin:0 auto;padding:16px}

/* INFO BAR */
.infobar{display:flex;align-items:center;gap:10px;padding:8px 14px;margin-bottom:14px;background:rgba(0,229,255,.03);border:1px solid rgba(0,229,255,.12);border-radius:6px;font-size:11px;color:var(--text2);flex-wrap:wrap}
.infobar .tag{background:rgba(0,229,255,.1);color:var(--cyan);padding:2px 8px;border-radius:3px;font-size:10px;font-weight:500}
.infobar .legend{display:flex;align-items:center;gap:5px}
.lu{color:var(--up)} .ld{color:var(--down)}
#lupd{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--text3);margin-left:auto}

/* ERR BANNER */
.errbr{display:none;padding:10px 14px;margin-bottom:12px;background:rgba(255,59,59,.07);border:1px solid rgba(255,59,59,.25);border-radius:6px;font-size:12px;color:var(--up)}
.errbr a{color:var(--cyan);text-decoration:underline;cursor:pointer}

/* LIGHTS */
.lights{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.alight{padding:12px 15px;border-radius:8px;border:1px solid var(--rim);background:var(--card);display:flex;align-items:center;gap:11px;position:relative;overflow:hidden;transition:all .3s}
.alight.lit-up{border-color:rgba(255,59,59,.5);background:linear-gradient(135deg,rgba(255,59,59,.07),var(--card));box-shadow:0 0 16px rgba(255,59,59,.09)}
.alight.lit-dn{border-color:rgba(0,204,122,.5);background:linear-gradient(135deg,rgba(0,204,122,.07),var(--card));box-shadow:0 0 16px rgba(0,204,122,.09)}
.alight.lit-wn{border-color:rgba(255,183,0,.5);background:linear-gradient(135deg,rgba(255,183,0,.07),var(--card));box-shadow:0 0 16px rgba(255,183,0,.09)}
.al-b{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;border:2px solid var(--rim);background:var(--ink);flex-shrink:0}
.alight.lit-up .al-b{border-color:var(--up);box-shadow:0 0 12px rgba(255,59,59,.4);background:rgba(255,59,59,.09)}
.alight.lit-dn .al-b{border-color:var(--down);box-shadow:0 0 12px rgba(0,204,122,.4);background:rgba(0,204,122,.09)}
.alight.lit-wn .al-b{border-color:var(--warn);box-shadow:0 0 12px rgba(255,183,0,.4);background:rgba(255,183,0,.09)}
.al-lbl{font-size:9px;color:var(--text3);letter-spacing:.5px;margin-bottom:2px}
.al-num{font-family:'Share Tech Mono',monospace;font-size:19px;font-weight:600}
.alight.lit-up .al-num{color:var(--up)} .alight.lit-dn .al-num{color:var(--down)} .alight.lit-wn .al-num{color:var(--warn)}
.al-sub{font-size:9px;color:var(--text3)}
.ablink{position:absolute;top:7px;right:7px;width:5px;height:5px;border-radius:50%}
.alight.lit-up .ablink{background:var(--up);animation:blink .9s infinite}
.alight.lit-dn .ablink{background:var(--down);animation:blink 1.6s infinite}
.alight.lit-wn .ablink{background:var(--warn);animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.1}}

/* LAYOUT */
.body-grid{display:grid;grid-template-columns:1fr 370px;gap:14px}
@media(max-width:1080px){.body-grid{grid-template-columns:1fr}}

/* RAIL */
.srail{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
.srail::-webkit-scrollbar{height:3px}
.srail::-webkit-scrollbar-thumb{background:var(--rim);border-radius:2px}
.scard{flex-shrink:0;min-width:135px;padding:9px 12px;border-radius:6px;border:1px solid var(--rim);background:var(--card);cursor:pointer;transition:all .2s;border-left:3px solid var(--rim)}
.scard:hover{transform:translateY(-1px);border-color:var(--cyan)}
.scard.s-buy{border-left-color:var(--up)} .scard.s-sell{border-left-color:var(--down)} .scard.s-warn{border-left-color:var(--warn)}
.sc-c{font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--cyan);margin-bottom:2px}
.sc-n{font-size:11px;font-weight:500}
.sc-p{font-family:'Share Tech Mono',monospace;font-size:14px;font-weight:600;margin-top:2px}
.sc-ch{font-size:9px;margin-top:1px}
.sc-sig{font-size:10px;font-weight:500;margin-top:3px}
.up{color:var(--up)} .dn{color:var(--down)}

/* CARD */
.card{background:var(--card);border:1px solid var(--rim);border-radius:10px;overflow:hidden}
.chead{display:flex;align-items:center;justify-content:space-between;padding:11px 17px;border-bottom:1px solid var(--rim);background:linear-gradient(90deg,rgba(0,229,255,.03),transparent)}
.ctitle{font-family:'Orbitron',monospace;font-size:10px;letter-spacing:2px;color:var(--cyan)}

/* TABLE */
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{padding:8px 12px;font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid var(--rim);text-align:left;font-weight:500;white-space:nowrap}
tbody tr{border-bottom:1px solid rgba(37,45,69,.4);transition:background .15s;cursor:pointer}
tbody tr:hover{background:rgba(0,229,255,.025)}
tbody tr.sel{background:rgba(0,229,255,.04)}
tbody td{padding:10px 12px;vertical-align:middle;white-space:nowrap}
.sname{font-weight:500;font-size:12px}
.scode{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--cyan);background:rgba(0,229,255,.08);padding:1px 5px;border-radius:3px;display:inline-block;margin-top:2px}
.pnum{font-family:'Share Tech Mono',monospace;font-size:14px;font-weight:600}
.cbadge{display:inline-flex;align-items:center;gap:2px;padding:2px 6px;border-radius:3px;font-family:'Share Tech Mono',monospace;font-size:10px;font-weight:600}
.cbadge.up{background:rgba(255,59,59,.12);color:var(--up)} .cbadge.dn{background:rgba(0,204,122,.1);color:var(--down)}
.ipill{padding:2px 5px;border-radius:3px;font-size:9px;font-weight:500;border:1px solid;display:inline-block;margin:1px}
.ip-r{background:rgba(255,59,59,.08);color:var(--up);border-color:rgba(255,59,59,.28)}
.ip-g{background:rgba(0,204,122,.08);color:var(--down);border-color:rgba(0,204,122,.28)}
.ip-y{background:rgba(255,183,0,.08);color:var(--warn);border-color:rgba(255,183,0,.28)}
.ip-b{background:rgba(0,229,255,.07);color:var(--cyan);border-color:rgba(0,229,255,.22)}
.sig-lmp{width:8px;height:8px;border-radius:50%}
.sig-lmp.buy{background:var(--up);box-shadow:0 0 6px var(--up);animation:blink 1s infinite}
.sig-lmp.sell{background:var(--down);box-shadow:0 0 6px var(--down);animation:blink 1.6s infinite}
.sig-lmp.warn{background:var(--warn);box-shadow:0 0 6px var(--warn);animation:blink 2s infinite}
.sig-lmp.hold{background:var(--text3);box-shadow:none}
.sig-t{font-size:10px;font-weight:500}
.sig-t.buy{color:var(--up)} .sig-t.sell{color:var(--down)} .sig-t.warn{color:var(--warn)} .sig-t.hold{color:var(--text3)}
.sbar-wrap{width:50px;background:var(--rim);border-radius:2px;height:4px;overflow:hidden}
.sbar{height:100%;border-radius:2px;transition:width .8s}

/* LOADING */
.sk{display:inline-block;width:60px;height:12px;background:linear-gradient(90deg,var(--rim) 25%,var(--card) 50%,var(--rim) 75%);background-size:200% 100%;animation:sh 1.5s infinite;border-radius:3px}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* SIDEBAR */
.sidebar{display:flex;flex-direction:column;gap:12px}
.gauge-card{background:var(--card);border:1px solid var(--rim);border-radius:10px;padding:15px}
.gtitle{font-family:'Orbitron',monospace;font-size:10px;letter-spacing:2px;color:var(--cyan);margin-bottom:4px}
.gname{font-size:11px;color:var(--text2);margin-bottom:11px}
.g-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.g-l{font-size:10px;color:var(--text2);width:52px;flex-shrink:0}
.g-tr{flex:1;height:5px;background:var(--rim);border-radius:3px;overflow:hidden}
.g-f{height:100%;border-radius:3px;transition:width .8s}
.g-v{font-family:'Share Tech Mono',monospace;font-size:10px;width:28px;text-align:right;flex-shrink:0}
.sring{display:flex;align-items:center;justify-content:center;width:68px;height:68px;border-radius:50%;border:3px solid var(--rim);background:var(--ink);font-family:'Orbitron',monospace;font-size:19px;font-weight:900;margin:12px auto 5px}
.sring.s-buy{border-color:var(--up);color:var(--up);box-shadow:0 0 16px rgba(255,59,59,.22)}
.sring.s-sell{border-color:var(--down);color:var(--down);box-shadow:0 0 16px rgba(0,204,122,.22)}
.sring.s-n{border-color:var(--warn);color:var(--warn)}
.log-card{background:var(--card);border:1px solid var(--rim);border-radius:10px;overflow:hidden}
.stabs{display:flex;padding:0 12px;border-bottom:1px solid var(--rim)}
.stab{padding:8px 10px;border:none;background:transparent;color:var(--text3);font-family:'Noto Sans TC',sans-serif;font-size:11px;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s}
.stab:hover{color:var(--text)}
.stab.active{color:var(--cyan);border-bottom-color:var(--cyan)}
.panel{padding:10px}
.subp{display:none}
.subp.active{display:block}
.lscroll{max-height:260px;overflow-y:auto}
.lscroll::-webkit-scrollbar{width:3px}
.lscroll::-webkit-scrollbar-thumb{background:var(--rim)}
.li{padding:7px 9px;border-radius:4px;border-left:2px solid var(--rim);margin-bottom:5px;font-size:11px;line-height:1.6;background:rgba(255,255,255,.015)}
.li.lb{border-left-color:var(--up);background:rgba(255,59,59,.04)}
.li.ls{border-left-color:var(--down);background:rgba(0,204,122,.04)}
.li.lw{border-left-color:var(--warn);background:rgba(255,183,0,.04)}
.lt{font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--text3);margin-bottom:2px}
.ln{font-weight:500}
.ld2{font-size:10px;color:var(--text2);margin-top:1px}
.clist{display:flex;flex-direction:column;gap:5px}
.ci{display:flex;align-items:center;justify-content:space-between;padding:6px 9px;border-radius:4px;background:var(--ink);border:1px solid var(--rim)}
.ci-l{display:flex;align-items:center;gap:7px}
.ci-d{width:5px;height:5px;border-radius:50%}
.ci-d.buy{background:var(--up)} .ci-d.sell{background:var(--down)} .ci-d.warn{background:var(--warn)}
.ci-n{font-size:10px;font-weight:500}
.ci-s{font-size:9px;color:var(--text3);margin-top:1px}
.tog{width:28px;height:16px;border-radius:8px;background:var(--rim);position:relative;cursor:pointer;border:none;transition:background .2s;flex-shrink:0}
.tog.on{background:var(--down)} .tog.sell.on{background:var(--up)} .tog.warn.on{background:var(--warn)}
.tog::after{content:'';position:absolute;width:10px;height:10px;background:white;border-radius:50%;top:3px;left:3px;transition:transform .2s}
.tog.on::after{transform:translateX(12px)}
.bkr{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.bkl{font-size:10px;color:var(--text2);width:58px;flex-shrink:0}
.bkbg{flex:1;height:6px;background:var(--rim);border-radius:3px;overflow:hidden}
.bkf{height:100%;border-radius:3px;transition:width .8s}
.bkv{font-family:'Share Tech Mono',monospace;font-size:10px;width:33px;text-align:right;flex-shrink:0}
/* ADD FORM */
.add-card{background:var(--card);border:1px solid var(--violet);border-radius:10px;overflow:hidden;display:none}
.fi{display:flex;flex-direction:column;gap:4px}
.fi label{font-size:9px;color:var(--text3);letter-spacing:.5px;text-transform:uppercase}
.fi input{background:var(--ink);border:1px solid var(--rim);color:var(--text);padding:7px 9px;border-radius:4px;font-family:'Noto Sans TC',sans-serif;font-size:12px;outline:none;transition:border-color .2s;width:100%}
.fi input:focus{border-color:var(--cyan)}
.fr{display:flex;gap:8px;margin-bottom:10px}
.obtn{padding:7px 13px;border-radius:4px;border:none;cursor:pointer;font-family:'Orbitron',monospace;font-size:9px;letter-spacing:1px;transition:all .2s}
.obtn.pri{background:rgba(0,229,255,.1);border:1px solid var(--cyan);color:var(--cyan)}
.obtn.dng{background:rgba(255,59,59,.1);border:1px solid rgba(255,59,59,.3);color:var(--up)}
.qchips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:11px}
.qc{padding:3px 8px;border-radius:3px;font-size:10px;cursor:pointer;background:var(--ink);border:1px solid var(--rim);color:var(--text2);transition:all .15s;font-family:'Share Tech Mono',monospace}
.qc:hover{border-color:var(--cyan);color:var(--cyan)}
</style>
</head>
<body>

<div class="topbar">
  <div>
    <div class="brand">台股中線雷達</div>
    <div class="brand-sub">TAIWAN STOCK RADAR · v4.0 · 紅漲綠跌</div>
  </div>
  <div class="topbar-r">
    <div class="mst"><div class="pdot" id="pdot"></div><span id="mstlbl">準備就緒</span></div>
    <div class="clock" id="clk">--:--:--</div>
    <button class="tbtn warn" id="pausebtn" onclick="toggleAuto()">⏸ 暫停</button>
    <button class="tbtn cyan" id="refbtn" onclick="fetchAll()">↺ 更新</button>
    <button class="tbtn violet" onclick="toggleAdd()">＋ 新增</button>
  </div>
</div>

<div class="main">
  <div class="infobar">
    <span class="tag">Yahoo Finance</span>
    延遲約 15 分鐘
    <span class="legend"><span class="lu">▲ 紅色 = 上漲</span>&nbsp;&nbsp;<span class="ld">▼ 綠色 = 下跌</span></span>
    <span id="lupd" style="margin-left:auto">尚未更新</span>
  </div>

  <div class="errbr" id="errbr">
    ⚠️ <span id="errmsg"></span>
    &nbsp;<a onclick="fetchAll()">重新嘗試</a>
  </div>

  <!-- LIGHTS -->
  <div class="lights">
    <div class="alight" id="l-buy"><div class="al-b">🔴</div><div><div class="al-lbl">買入訊號</div><div class="al-num" id="c-buy">0</div><div class="al-sub">BUY SIGNAL</div></div><div class="ablink"></div></div>
    <div class="alight" id="l-sell"><div class="al-b">🟢</div><div><div class="al-lbl">賣出訊號</div><div class="al-num" id="c-sell">0</div><div class="al-sub">SELL SIGNAL</div></div><div class="ablink"></div></div>
    <div class="alight" id="l-warn"><div class="al-b">🟡</div><div><div class="al-lbl">注意警示</div><div class="al-num" id="c-warn">0</div><div class="al-sub">WARNING</div></div><div class="ablink"></div></div>
    <div class="alight" id="l-vol"><div class="al-b">📊</div><div><div class="al-lbl">量能爆增</div><div class="al-num" id="c-vol">0</div><div class="al-sub">VOL SURGE</div></div><div class="ablink"></div></div>
  </div>

  <div class="body-grid">
    <div>
      <div class="srail" id="srail"></div>
      <div class="card">
        <div class="chead">
          <div class="ctitle">📡 監控清單</div>
          <div style="display:flex;gap:6px">
            <button class="obtn pri" style="font-size:8px;padding:4px 9px" onclick="fetchAll()">↺ 更新報價</button>
            <button class="obtn pri" style="font-size:8px;padding:4px 9px;border-color:var(--violet);color:var(--violet)" onclick="toggleAdd()">＋ 新增</button>
          </div>
        </div>
        <div style="overflow-x:auto">
          <table>
            <thead>
              <tr><th>股票</th><th>現價</th><th>漲跌</th><th>技術訊號</th><th>PE</th><th>殖利率</th><th>燈號</th><th>強度</th><th></th></tr>
            </thead>
            <tbody id="tbl"></tbody>
          </table>
          <div id="tbl-empty" style="text-align:center;padding:36px;color:var(--text3);font-size:12px;display:none">📭 點擊「＋ 新增」加入監控股票</div>
        </div>
      </div>
    </div>

    <div class="sidebar">
      <div class="gauge-card">
        <div class="gtitle">📡 SIGNAL GAUGE</div>
        <div class="gname" id="gname">點選股票查看分析</div>
        <div id="grows"><div style="color:var(--text3);font-size:11px;text-align:center;padding:10px">—</div></div>
        <div id="gscore" style="display:none">
          <div class="sring" id="sring">—</div>
          <div style="text-align:center;font-size:10px;color:var(--text2);letter-spacing:.5px" id="sverd"></div>
        </div>
      </div>

      <div class="log-card">
        <div class="stabs">
          <button class="stab active" onclick="stab('log')">訊號紀錄</button>
          <button class="stab" onclick="stab('conds')">條件設定</button>
          <button class="stab" onclick="stab('fund')">基本面</button>
        </div>
        <div class="subp active" id="sp-log" style="padding:8px"><div class="lscroll" id="loglist"><div style="text-align:center;padding:20px;color:var(--text3);font-size:11px">等待資料載入...</div></div></div>
        <div class="subp panel" id="sp-conds"><div class="clist" id="condlist"></div></div>
        <div class="subp panel" id="sp-fund"><div id="fundcontent"><div style="color:var(--text3);font-size:11px;text-align:center;padding:20px">點選股票查看基本面</div></div></div>
      </div>

      <div class="add-card" id="add-card">
        <div class="chead">
          <div class="ctitle">＋ 新增股票</div>
          <button class="obtn dng" style="font-size:8px;padding:3px 8px" onclick="toggleAdd()">✕</button>
        </div>
        <div style="padding:13px">
          <div class="qchips" id="qchips"></div>
          <div class="fr">
            <div class="fi"><label>代碼</label><input id="i-code" placeholder="2330" maxlength="6"></div>
            <div class="fi" style="flex:2"><label>名稱（選填）</label><input id="i-name" placeholder="自動抓取"></div>
          </div>
          <div class="fr">
            <div class="fi"><label>停損價</label><input id="i-stop" type="number" placeholder="選填"></div>
            <div class="fi"><label>目標價</label><input id="i-tp" type="number" placeholder="選填"></div>
          </div>
          <button class="obtn pri" style="width:100%;font-size:10px;padding:8px" onclick="addStock()">✅ 加入監控清單</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════
let stocks = [];
let logs = [];
let selIdx = null;
let autoOn = true;
let autoTimer = null;

const CONDITIONS = [
  {id:'kd_golden',  name:'KD 黃金交叉',  desc:'K值上穿D值（超賣區）',   type:'buy',  on:true},
  {id:'kd_death',   name:'KD 死亡交叉',  desc:'K值下穿D值（超買區）',   type:'sell', on:true},
  {id:'rsi_lo',     name:'RSI 超賣',     desc:'RSI < 30，底部反彈機會', type:'buy',  on:true},
  {id:'rsi_hi',     name:'RSI 超買',     desc:'RSI > 70，獲利了結訊號', type:'sell', on:true},
  {id:'macd_bull',  name:'MACD 翻多',    desc:'MACD柱狀正值擴大',       type:'buy',  on:true},
  {id:'macd_bear',  name:'MACD 翻空',    desc:'MACD柱狀負值擴大',       type:'sell', on:false},
  {id:'ma_bull',    name:'均線多頭排列', desc:'MA5>MA20>MA60全面向上',  type:'buy',  on:true},
  {id:'break_ma60', name:'突破月線',     desc:'股價站上MA60（月線）',   type:'buy',  on:true},
  {id:'vol_surge',  name:'成交量爆增',   desc:'今日量 > 5日均量 200%',  type:'warn', on:true},
  {id:'brk_ma20',   name:'跌破週線',     desc:'跌破MA20且收跌',         type:'warn', on:true},
  {id:'stoploss',   name:'觸及停損',     desc:'低於自訂停損價',         type:'sell', on:true},
  {id:'target',     name:'達到目標價',   desc:'高於自訂目標價',         type:'warn', on:true},
];

const QUICK = [
  {code:'2330',name:'台積電'},{code:'2317',name:'鴻海'},{code:'2454',name:'聯發科'},
  {code:'2308',name:'台達電'},{code:'3008',name:'大立光'},{code:'2882',name:'國泰金'},
  {code:'0050',name:'元大50'},{code:'2412',name:'中華電'},{code:'00878',name:'國泰高股息'},
  {code:'6505',name:'台塑化'},{code:'2303',name:'聯電'},{code:'2357',name:'華碩'},
];

// ═══════════════════════════════════════════
// YAHOO FINANCE FETCH — 三種方法依序嘗試
// ═══════════════════════════════════════════
function twSymbol(code) {
  // 上市 .TW / 上櫃 .TWO / ETF
  const otc = ['6269','6271','3045','4137','4763','5871','8076','8299'];
  if (otc.includes(code)) return code + '.TWO';
  return code + '.TW';
}

async function yFetch(code) {
  const sym = twSymbol(code);
  const yUrl = `https://query2.finance.yahoo.com/v8/finance/chart/${sym}?range=3mo&interval=1d&includePrePost=false`;

  // Method 1: Direct (works if browser CORS allows)
  // Method 2: Multiple CORS proxies
  const attempts = [
    () => fetch(yUrl, { headers: { 'Accept': 'application/json' } }),
    () => fetch(`https://corsproxy.io/?${encodeURIComponent(yUrl)}`),
    () => fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(yUrl)}`),
    () => fetch(`https://thingproxy.freeboard.io/fetch/${yUrl}`),
    () => fetch(`https://cors-anywhere.herokuapp.com/${yUrl}`, { headers: { 'X-Requested-With': 'XMLHttpRequest' }}),
  ];

  for (const attempt of attempts) {
    try {
      const res = await Promise.race([
        attempt(),
        new Promise((_, r) => setTimeout(() => r(new Error('timeout')), 7000))
      ]);
      if (!res.ok) continue;
      const data = await res.json();
      const result = data?.chart?.result?.[0];
      if (!result) continue;
      return result;
    } catch(e) { /* try next */ }
  }
  return null;
}

// ═══════════════════════════════════════════
// TECHNICAL INDICATORS
// ═══════════════════════════════════════════
function calcRSI(closes, n=14) {
  if (closes.length < n+1) return 50;
  let g=0, l=0;
  for (let i=closes.length-n; i<closes.length; i++) {
    const d = closes[i]-closes[i-1];
    if(d>0) g+=d; else l+=Math.abs(d);
  }
  const rs = (g/n) / Math.max(l/n, 1e-9);
  return 100 - 100/(1+rs);
}

function calcKD(closes, n=9) {
  if (closes.length < n) return {k:50, d:50};
  const sl = closes.slice(-n);
  const hi = Math.max(...sl), lo = Math.min(...sl);
  const rsv = hi===lo ? 50 : (closes.at(-1)-lo)/(hi-lo)*100;
  const k = rsv*0.33 + 50*0.67;
  const d = k*0.33  + 50*0.67;
  return {k, d};
}

function calcMACD(closes) {
  if (closes.length < 26) return 0;
  const ema = (arr, n) => {
    const k=2/(n+1); let e=arr[0];
    for(let i=1;i<arr.length;i++) e=arr[i]*k+e*(1-k);
    return e;
  };
  const e12 = ema(closes.slice(-26), 12);
  const e26 = ema(closes.slice(-26), 26);
  return (e12-e26)/closes.at(-1)*100;
}

function calcMAs(closes) {
  const ma = n => closes.length>=n ? closes.slice(-n).reduce((a,b)=>a+b)/n : closes.at(-1);
  return { ma5:ma(5), ma20:ma(20), ma60:ma(60) };
}

function volRatio(vols) {
  if (vols.length < 6) return 1;
  const avg = vols.slice(-6,-1).reduce((a,b)=>a+b)/5;
  return vols.at(-1) / Math.max(avg, 1);
}

// ═══════════════════════════════════════════
// FETCH & PROCESS
// ═══════════════════════════════════════════
async function fetchOne(i) {
  const s = stocks[i];
  stocks[i].loading = true;
  stocks[i].err = null;
  renderRow(i);

  const result = await yFetch(s.code);
  stocks[i].loading = false;

  if (!result) {
    stocks[i].err = '無法取得資料';
    renderRow(i);
    return false;
  }

  const meta   = result.meta;
  const closes = (result.indicators?.quote?.[0]?.close  || []).filter(v=>v!=null);
  const vols   = (result.indicators?.quote?.[0]?.volume || []).filter(v=>v!=null);

  if (!closes.length) {
    stocks[i].err = '無收盤資料';
    renderRow(i);
    return false;
  }

  const price     = meta.regularMarketPrice ?? closes.at(-1);
  const prevClose = meta.previousClose ?? meta.chartPreviousClose ?? closes.at(-2) ?? price;
  const change    = price - prevClose;
  const changePct = prevClose ? change/prevClose*100 : 0;
  const vol       = meta.regularMarketVolume ?? vols.at(-1) ?? 0;
  const vr        = volRatio(vols);
  const pe        = meta.trailingPE ?? 0;
  const dy        = meta.dividendYield ? meta.dividendYield*100 : 0;
  const eps       = pe>0 ? price/pe : 0;
  const rsi       = calcRSI(closes);
  const {k,d}     = calcKD(closes);
  const macd      = calcMACD(closes);
  const mas       = calcMAs(closes);
  const nm        = s.name && s.name !== s.code ? s.name : (meta.shortName || meta.longName || s.code);

  stocks[i] = { ...s, name:nm, price, prevClose, change, changePct, vol, vr, pe, dy, eps, rsi, kd_k:k, kd_d:d, macd, ...mas, loading:false, err:null };
  return true;
}

async function fetchAll() {
  if (!stocks.length) return;
  setStatus('loading');
  hideErr();
  let ok = 0;
  await Promise.all(stocks.map(async(_,i) => { if(await fetchOne(i)) ok++; }));
  renderRail(); renderLights();
  if (selIdx!==null) { renderGauge(selIdx); renderFund(selIdx); }
  setStatus(ok>0 ? 'on' : 'off');
  if (ok===0) showErr('無法取得股票資料。請確認網路連線，或 Yahoo Finance 目前服務異常，請稍後再試。');
  else if (ok < stocks.length) showErr(`部分股票無法取得資料（${stocks.length-ok}/${stocks.length}），其餘已更新。`);
  const n=new Date();
  document.getElementById('lupd').textContent = `更新 ${[n.getHours(),n.getMinutes(),n.getSeconds()].map(v=>String(v).padStart(2,'0')).join(':')}`;
}

// ═══════════════════════════════════════════
// ADD / REMOVE
// ═══════════════════════════════════════════
async function addStock() {
  const code = document.getElementById('i-code').value.trim().toUpperCase();
  if (!code) { alert('請輸入股票代碼'); return; }
  if (stocks.find(s=>s.code===code)) { alert('此股票已在清單中'); return; }
  const name = document.getElementById('i-name').value.trim() || code;
  const stop = parseFloat(document.getElementById('i-stop').value)||null;
  const tp   = parseFloat(document.getElementById('i-tp').value)||null;
  stocks.push({code,name,stop,tp,price:0,loading:true,err:null,change:0,changePct:0,pe:0,dy:0,eps:0,rsi:50,kd_k:50,kd_d:50,macd:0,ma5:0,ma20:0,ma60:0,vr:1});
  renderTable(); renderRail();
  toggleAdd();
  const ok = await fetchOne(stocks.length-1);
  renderRow(stocks.length-1); renderRail(); renderLights();
  if (ok) pushLog('buy', `📡 加入監控`, `${stocks.at(-1).name}（${code}） 現價 $${stocks.at(-1).price.toFixed(1)}`);
}

function removeStock(i) {
  stocks.splice(i,1);
  if(selIdx===i) selIdx=null;
  else if(selIdx>i) selIdx--;
  renderTable(); renderRail(); renderLights();
}

// ═══════════════════════════════════════════
// SIGNALS
// ═══════════════════════════════════════════
function cOn(id) { return CONDITIONS.find(c=>c.id===id)?.on; }

function computeSigs(s) {
  if (!s.price) return [];
  const sg = [];
  if(cOn('kd_golden') && s.kd_k>s.kd_d && s.kd_k<55) sg.push({type:'buy', label:'KD金叉'});
  if(cOn('kd_death')  && s.kd_k<s.kd_d && s.kd_k>45) sg.push({type:'sell',label:'KD死叉'});
  if(cOn('rsi_lo')    && s.rsi<30)                     sg.push({type:'buy', label:'RSI超賣'});
  if(cOn('rsi_hi')    && s.rsi>70)                     sg.push({type:'sell',label:'RSI超買'});
  if(cOn('macd_bull') && s.macd>0.5)                   sg.push({type:'buy', label:'MACD翻多'});
  if(cOn('macd_bear') && s.macd<-0.5)                  sg.push({type:'sell',label:'MACD翻空'});
  if(cOn('ma_bull')   && s.ma5>s.ma20 && s.ma20>s.ma60) sg.push({type:'buy',label:'均線多排'});
  if(cOn('break_ma60')&& s.price>s.ma60 && s.price<s.ma60*1.04) sg.push({type:'buy',label:'突破月線'});
  if(cOn('vol_surge') && s.vr>2)                       sg.push({type:'warn',label:`量${s.vr.toFixed(1)}x`});
  if(cOn('brk_ma20')  && s.price<s.ma20 && s.changePct<-0.5) sg.push({type:'warn',label:'跌破週線'});
  if(cOn('stoploss')  && s.stop && s.price<s.stop)     sg.push({type:'sell',label:'⚠停損'});
  if(cOn('target')    && s.tp   && s.price>=s.tp)      sg.push({type:'warn',label:'🎯目標'});
  return sg;
}

function masterSig(sgs) {
  const b=sgs.filter(s=>s.type==='buy').length;
  const s=sgs.filter(s=>s.type==='sell').length;
  const sc=b-s;
  if(sc>=2)  return{type:'buy', label:'強力買入',sc};
  if(sc===1) return{type:'buy', label:'買入訊號',sc};
  if(sc<=-2) return{type:'sell',label:'強力賣出',sc};
  if(sc===-1)return{type:'sell',label:'賣出訊號',sc};
  if(sgs.some(s=>s.type==='warn')) return{type:'warn',label:'注意警示',sc};
  return{type:'hold',label:'觀望',sc};
}

// ═══════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════
function renderTable() {
  const tbody=document.getElementById('tbl');
  const empty=document.getElementById('tbl-empty');
  if(!stocks.length){tbody.innerHTML='';empty.style.display='block';return}
  empty.style.display='none';
  tbody.innerHTML=stocks.map((_,i)=>buildRow(i)).join('');
}

function renderRow(i) {
  const rows=document.getElementById('tbl').querySelectorAll('tr');
  const html=buildRow(i);
  if(rows[i]) rows[i].outerHTML=html;
  else renderTable();
}

function buildRow(i) {
  const s=stocks[i];
  if(s.loading) return `<tr><td colspan="9" style="padding:12px;color:var(--text3);font-size:11px"><span class="sk"></span> ${s.name||s.code} 載入中...</td></tr>`;
  if(s.err)     return `<tr><td colspan="9" style="padding:12px;font-size:11px"><span style="color:var(--warn)">⚠ ${s.code}：${s.err}</span> <button class="obtn pri" style="font-size:8px;padding:2px 7px;margin-left:8px" onclick="retry(${i})">重試</button> <button class="obtn dng" style="font-size:8px;padding:2px 7px" onclick="removeStock(${i})">移除</button></td></tr>`;
  const sgs=computeSigs(s); const ms=masterSig(sgs);
  const up=s.changePct>=0;
  const pills=sgs.slice(0,4).map(sg=>`<span class="ipill ${sg.type==='buy'?'ip-r':sg.type==='sell'?'ip-g':'ip-y'}">${sg.label}</span>`).join('');
  const bw=Math.min(100,Math.abs(ms.sc)/3*100);
  const bc=ms.type==='buy'?'var(--up)':ms.type==='sell'?'var(--down)':'var(--warn)';
  const fmt=p=>p>100?p.toFixed(1):p.toFixed(2);
  return`<tr class="${selIdx===i?'sel':''}" onclick="selectStock(${i})">
    <td><div class="sname">${s.name}</div><div class="scode">${s.code}</div></td>
    <td><div class="pnum ${up?'up':'dn'}">$${fmt(s.price)}</div></td>
    <td><span class="cbadge ${up?'up':'dn'}">${up?'▲':'▼'}${Math.abs(s.changePct).toFixed(2)}%</span></td>
    <td>${pills||'<span style="color:var(--text3);font-size:10px">—</span>'}</td>
    <td><span class="ipill ${s.pe>0&&s.pe<15?'ip-g':s.pe>30?'ip-r':'ip-b'}">${s.pe>0?s.pe.toFixed(1):'—'}</span></td>
    <td><span class="ipill ${s.dy>4?'ip-g':s.dy>0&&s.dy<2.5?'ip-r':'ip-b'}">${s.dy>0?s.dy.toFixed(1)+'%':'—'}</span></td>
    <td><div style="display:flex;align-items:center;gap:5px"><div class="sig-lmp ${ms.type}"></div><div class="sig-t ${ms.type}">${ms.label}</div></div></td>
    <td><div class="sbar-wrap"><div class="sbar" style="width:${bw}%;background:${bc}"></div></div></td>
    <td><button class="obtn dng" style="font-size:8px;padding:3px 7px" onclick="event.stopPropagation();removeStock(${i})">✕</button></td>
  </tr>`;
}

function renderRail() {
  const rail=document.getElementById('srail');
  if(!stocks.length){rail.innerHTML='';return}
  rail.innerHTML=stocks.map((s,i)=>{
    if(s.loading) return`<div class="scard"><div class="sc-c">${s.code}</div><div class="sk" style="width:80px;margin-top:6px"></div></div>`;
    if(s.err) return`<div class="scard" style="border-left-color:var(--warn)"><div class="sc-c">${s.code}</div><div style="font-size:10px;color:var(--warn)">⚠ 無資料</div></div>`;
    const sgs=computeSigs(s); const ms=masterSig(sgs); const up=s.changePct>=0;
    return`<div class="scard s-${ms.type}" onclick="selectStock(${i})">
      <div class="sc-c">${s.code}</div>
      <div class="sc-n">${s.name}</div>
      <div class="sc-p ${up?'up':'dn'}">$${s.price>100?s.price.toFixed(1):s.price.toFixed(2)}</div>
      <div class="sc-ch ${up?'up':'dn'}">${up?'▲':'▼'}${Math.abs(s.changePct).toFixed(2)}%</div>
      <div class="sc-sig" style="color:${ms.type==='buy'?'var(--up)':ms.type==='sell'?'var(--down)':'var(--warn)'}">${ms.label}</div>
    </div>`;
  }).join('');
}

function renderLights() {
  let buy=0,sell=0,warn=0,vol=0;
  stocks.filter(s=>!s.loading&&!s.err).forEach(s=>{
    const ms=masterSig(computeSigs(s));
    if(ms.type==='buy') buy++;
    if(ms.type==='sell') sell++;
    if(ms.type==='warn') warn++;
    if(s.vr>2) vol++;
  });
  document.getElementById('c-buy').textContent=buy;
  document.getElementById('c-sell').textContent=sell;
  document.getElementById('c-warn').textContent=warn;
  document.getElementById('c-vol').textContent=vol;
  document.getElementById('l-buy').className='alight'+(buy>0?' lit-up':'');
  document.getElementById('l-sell').className='alight'+(sell>0?' lit-dn':'');
  document.getElementById('l-warn').className='alight'+(warn>0?' lit-wn':'');
  document.getElementById('l-vol').className='alight'+(vol>0?' lit-wn':'');
}

function selectStock(i) {
  selIdx=i; renderTable(); renderGauge(i); renderFund(i);
}

function renderGauge(i) {
  const s=stocks[i];
  if(!s||s.loading||s.err||!s.price) return;
  document.getElementById('gname').textContent=`${s.name}（${s.code}）`;
  const rows=[
    {l:'RSI',    v:s.rsi,  c:s.rsi<30?'var(--down)':s.rsi>70?'var(--up)':'var(--cyan)'},
    {l:'KD-K',   v:s.kd_k, c:s.kd_k>s.kd_d?'var(--up)':'var(--down)'},
    {l:'KD-D',   v:s.kd_d, c:'var(--violet)'},
    {l:'MACD',   v:Math.min(100,Math.max(0,(s.macd+3)/6*100)), c:s.macd>0?'var(--up)':'var(--down)'},
    {l:'量比',   v:Math.min(100,s.vr/4*100), c:s.vr>2?'var(--warn)':'var(--teal)'},
    {l:'MA排列', v:s.ma5>s.ma20&&s.ma20>s.ma60?90:s.ma5<s.ma20&&s.ma20<s.ma60?10:50, c:s.ma5>s.ma20?'var(--up)':'var(--down)'},
  ];
  document.getElementById('grows').innerHTML=rows.map(r=>`
    <div class="g-row">
      <div class="g-l">${r.l}</div>
      <div class="g-tr"><div class="g-f" style="width:${r.v.toFixed(0)}%;background:${r.c}"></div></div>
      <div class="g-v" style="color:${r.c}">${r.v.toFixed(0)}</div>
    </div>`).join('');
  const sgs=computeSigs(s); const ms=masterSig(sgs);
  document.getElementById('gscore').style.display='block';
  const ring=document.getElementById('sring');
  ring.textContent=(ms.sc>=0?'+':'')+ms.sc;
  ring.className='sring '+(ms.type==='buy'?'s-buy':ms.type==='sell'?'s-sell':'s-n');
  const vm={buy:'中線偏多，可考慮佈局',sell:'中線偏空，注意風險',warn:'訊號混沌，觀望為宜',hold:'無明顯訊號'};
  document.getElementById('sverd').textContent=vm[ms.type]||'—';
}

function renderFund(i) {
  const el=document.getElementById('fundcontent');
  const s=stocks[i];
  if(!s||s.err||!s.price){el.innerHTML='<div style="color:var(--text3);font-size:11px;text-align:center;padding:16px">無基本面資料</div>';return}
  const pec=s.pe>0&&s.pe<15?'var(--down)':s.pe>30?'var(--up)':'var(--cyan)';
  const dyc=s.dy>4?'var(--down)':s.dy>0&&s.dy<2.5?'var(--up)':'var(--cyan)';
  el.innerHTML=`
    <div style="font-size:10px;color:var(--text2);margin-bottom:10px">${s.name} 基本面</div>
    <div class="bkr"><div class="bkl">本益比 PE</div><div class="bkbg"><div class="bkf" style="width:${Math.min(100,(s.pe||0)/50*100)}%;background:${pec}"></div></div><div class="bkv" style="color:${pec}">${s.pe>0?s.pe.toFixed(1):'N/A'}</div></div>
    <div class="bkr"><div class="bkl">殖利率</div><div class="bkbg"><div class="bkf" style="width:${Math.min(100,(s.dy||0)/8*100)}%;background:${dyc}"></div></div><div class="bkv" style="color:${dyc}">${s.dy>0?s.dy.toFixed(1)+'%':'N/A'}</div></div>
    <div class="bkr"><div class="bkl">EPS 估</div><div class="bkbg"><div class="bkf" style="width:${Math.min(100,(s.eps||0)/80*100)}%;background:var(--cyan)"></div></div><div class="bkv" style="color:var(--cyan)">${s.eps>0?s.eps.toFixed(1):'N/A'}</div></div>
    <div class="bkr"><div class="bkl">成交量比</div><div class="bkbg"><div class="bkf" style="width:${Math.min(100,(s.vr||0)/4*100)}%;background:${s.vr>2?'var(--warn)':'var(--teal)'}"></div></div><div class="bkv" style="color:${s.vr>2?'var(--warn)':'var(--teal)'}">${(s.vr||0).toFixed(1)}x</div></div>
    <div style="margin-top:10px;font-size:9px;color:var(--text3);line-height:1.9">
      <div>${s.pe>0?(s.pe<15?'✅ PE低估，具安全邊際':s.pe>30?'⚠️ PE偏高，謹慎追價':'🟡 PE合理'):'PE 資料不足'}</div>
      <div>${s.dy>0?(s.dy>4?'✅ 高息防禦，配息吸引':s.dy>=2.5?'🟡 殖利率尚可':'⚠️ 殖利率偏低'):'殖利率 資料不足'}</div>
    </div>`;
}

// ═══════════════════════════════════════════
// LOG
// ═══════════════════════════════════════════
function pushLog(type,title,desc) {
  const n=new Date();
  const t=[n.getHours(),n.getMinutes(),n.getSeconds()].map(v=>String(v).padStart(2,'0')).join(':');
  logs.unshift({type,title,desc,t});
  const el=document.getElementById('loglist');
  el.innerHTML=logs.slice(0,60).map(l=>`
    <div class="li ${l.type==='buy'?'lb':l.type==='sell'?'ls':'lw'}">
      <div class="lt">${l.t}</div>
      <div class="ln">${l.title}</div>
      <div class="ld2">${l.desc}</div>
    </div>`).join('');
}

// ═══════════════════════════════════════════
// CONDITIONS
// ═══════════════════════════════════════════
function renderConditions() {
  document.getElementById('condlist').innerHTML=CONDITIONS.map((c,i)=>`
    <div class="ci">
      <div class="ci-l">
        <div class="ci-d ${c.type}"></div>
        <div><div class="ci-n">${c.name}</div><div class="ci-s">${c.desc}</div></div>
      </div>
      <button class="tog ${c.on?'on':''} ${c.type}" onclick="toggleCond(${i})"></button>
    </div>`).join('');
}
function toggleCond(i){CONDITIONS[i].on=!CONDITIONS[i].on;renderConditions();renderTable();renderRail();renderLights();}

// ═══════════════════════════════════════════
// UI HELPERS
// ═══════════════════════════════════════════
function setStatus(s) {
  const dot=document.getElementById('pdot');
  const lbl=document.getElementById('mstlbl');
  if(s==='loading'){dot.className='pdot spin';lbl.textContent='更新中...';document.getElementById('refbtn').disabled=true;document.getElementById('refbtn').textContent='載入中...';}
  else if(s==='on'){dot.className='pdot';lbl.textContent='自動更新中';document.getElementById('refbtn').disabled=false;document.getElementById('refbtn').textContent='↺ 更新';}
  else{dot.className='pdot off';lbl.textContent='更新失敗';document.getElementById('refbtn').disabled=false;document.getElementById('refbtn').textContent='↺ 重試';}
}
function showErr(m){const b=document.getElementById('errbr');b.style.display='block';document.getElementById('errmsg').textContent=m;}
function hideErr(){document.getElementById('errbr').style.display='none'}
function toggleAdd(){const c=document.getElementById('add-card');c.style.display=c.style.display==='none'?'block':'none'}
function stab(id){
  document.querySelectorAll('.stab').forEach((t,i)=>t.classList.toggle('active',['log','conds','fund'][i]===id));
  ['sp-log','sp-conds','sp-fund'].forEach(p=>document.getElementById(p).classList.remove('active'));
  document.getElementById('sp-'+id).classList.add('active');
}
function renderClock(){const n=new Date();document.getElementById('clk').textContent=[n.getHours(),n.getMinutes(),n.getSeconds()].map(v=>String(v).padStart(2,'0')).join(':')}
function renderQchips(){document.getElementById('qchips').innerHTML=QUICK.map(q=>`<div class="qc" onclick="qf('${q.code}','${q.name}')">${q.code} ${q.name}</div>`).join('')}
function qf(c,n){document.getElementById('i-code').value=c;document.getElementById('i-name').value=n}
function toggleAuto(){
  autoOn=!autoOn;
  const btn=document.getElementById('pausebtn');
  if(autoOn){btn.textContent='⏸ 暫停';btn.className='tbtn warn';}
  else{btn.textContent='▶ 恢復';btn.className='tbtn cyan';}
}
async function retry(i){stocks[i].err=null;await fetchOne(i);renderRow(i);renderRail();renderLights();}

// ═══════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════
async function init() {
  renderClock(); setInterval(renderClock,1000);
  renderConditions(); renderQchips();

  const defaults=['2330','2317','2454','2308'];
  defaults.forEach(code=>{
    stocks.push({code,name:code,stop:null,tp:null,price:0,loading:true,err:null,change:0,changePct:0,pe:0,dy:0,eps:0,rsi:50,kd_k:50,kd_d:50,macd:0,ma5:0,ma20:0,ma60:0,vr:1});
  });
  renderTable(); renderRail();
  await fetchAll();

  // Log signals after load
  stocks.filter(s=>!s.err&&s.price>0).forEach(s=>{
    const sgs=computeSigs(s); const ms=masterSig(sgs);
    if(ms.type!=='hold') {
      pushLog(ms.type,
        `${ms.type==='buy'?'🔴':ms.type==='sell'?'🟢':'🟡'} ${s.name}（${s.code}） ${ms.label}`,
        `${sgs.map(g=>g.label).join('、')} ｜ $${s.price.toFixed(1)}，RSI ${s.rsi.toFixed(0)}`
      );
    }
  });

  // Auto refresh every 3 minutes
  autoTimer = setInterval(()=>{ if(autoOn&&stocks.length) fetchAll(); }, 180000);
}

window.onload=init;
</script>
